<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student To-Do List app to organize daily tasks.">
  <title>Student To-Do List</title>
  <style>
    :root { --primary:#5b5ce2; --ink:#20233a; --muted:#68708a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:linear-gradient(135deg,#eef2ff,#f8fafc); }
    .app { width:min(720px,100%); margin:0 auto; background:white; border-radius:22px; padding:clamp(20px,5vw,36px); box-shadow:0 18px 55px #29316b18; }
    header { text-align:center; margin-bottom:28px; }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,5vw,2.5rem); }
    header p,.hint { color:var(--muted); }
    .entry { display:flex; gap:10px; }
    input,button { font:inherit; border-radius:10px; padding:12px 14px; }
    #taskInput { min-width:0; flex:1; border:1px solid #d8dced; }
    button { border:0; cursor:pointer; font-weight:650; }
    button:hover { opacity:.88; }
    .add,.filter.active { background:var(--primary); color:white; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; }
    .filter { background:#eef0ff; color:#4143ad; }
    .summary { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.92rem; margin-bottom:10px; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid #edf0f6; }
    li:last-child { border-bottom:0; }
    li input[type=checkbox] { width:18px; height:18px; accent-color:var(--primary); }
    .task-text { flex:1; overflow-wrap:anywhere; }
    li.done .task-text { text-decoration:line-through; color:#8990a3; }
    .delete { background:#fff0f0; color:#bd3434; padding:8px 10px; }
    .empty { justify-content:center; text-align:center; padding:28px 10px; color:var(--muted); }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:18px; }
    .clear { background:#f1f3f8; color:#4b5368; }
    .hint { font-size:.82rem; margin-top:20px; text-align:center; }
    @media(max-width:480px) { .entry { flex-direction:column; } .add { width:100%; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>📝 Student To-Do List</h1>
      <p>Plan your day, finish your tasks, and celebrate your progress.</p>
    </header>
    <form class="entry" id="taskForm">
      <input id="taskInput" type="text" maxlength="160" placeholder="Add a task (e.g., Study Python)" aria-label="New task" required>
      <button class="add" type="submit">+ Add Task</button>
    </form>
    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" type="button" data-filter="all">All</button>
      <button class="filter" type="button" data-filter="active">Pending</button>
      <button class="filter" type="button" data-filter="completed">Completed</button>
    </nav>
    <div class="summary"><span id="taskCount">0 tasks</span><span id="progress">0 completed</span></div>
    <ul id="taskList" aria-live="polite"></ul>
    <div class="footer">
      <span class="hint" style="margin:0">Your tasks are saved in this browser.</span>
      <button class="clear" id="clearCompleted" type="button">Clear completed</button>
    </div>
    <p class="hint">Student mini project • HTML, CSS, JavaScript, Local Storage</p>
  </main>
  <script>
    const STORAGE_KEY = "student-todo-tasks-v1";
    let tasks = loadTasks();
    let currentFilter = "all";
    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");
    const count = document.querySelector("#taskCount");
    const progress = document.querySelector("#progress");

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(t => t && typeof t.text === "string") : [];
      } catch { return []; }
    }
    function saveTasks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      catch { alert("Could not save tasks. Check your browser storage settings."); }
    }
    function render() {
      list.replaceChildren();
      const visible = tasks.filter(t => currentFilter === "all" ||
        (currentFilter === "active" && !t.completed) ||
        (currentFilter === "completed" && t.completed));
      count.textContent = tasks.length + (tasks.length === 1 ? " task" : " tasks");
      progress.textContent = tasks.filter(t => t.completed).length + " completed";
      document.querySelectorAll("[data-filter]").forEach(btn => {
        const active = btn.dataset.filter === currentFilter;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });
      if (!visible.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = tasks.length ? "No tasks in this filter. 🎯" : "No tasks yet. Add your first task above! ✨";
        list.append(empty);
        return;
      }
      visible.forEach(task => {
        const item = document.createElement("li");
        item.classList.toggle("done", task.completed);
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox"; checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark " + task.text + " as completed");
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked; saveTasks(); render();
        });
        const label = document.createElement("span");
        label.className = "task-text"; label.textContent = task.text;
        const remove = document.createElement("button");
        remove.className = "delete"; remove.type = "button"; remove.textContent = "Delete";
        remove.setAttribute("aria-label", "Delete " + task.text);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id); saveTasks(); render();
        });
        item.append(checkbox, label, remove);
        list.append(item);
      });
    }
    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.unshift({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), text, completed: false });
      saveTasks(); input.value = ""; input.focus(); render();
    });
    document.querySelectorAll("[data-filter]").forEach(btn =>
      btn.addEventListener("click", () => { currentFilter = btn.dataset.filter; render(); }));
    document.querySelector("#clearCompleted").addEventListener("click", () => {
      tasks = tasks.filter(t => !t.completed); saveTasks(); render();
    });
    render();
  </script>
</body>
</html>
